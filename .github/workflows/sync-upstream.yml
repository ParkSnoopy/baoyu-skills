name: Check upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git pull --ff-only https://github.com/JimLiu/baoyu-skills main
          test -d skills && test -d .github/workflows && test -f LICENSE
          test -z "$(find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name skills ! -name LICENSE -print -quit)"
          test -z "$(find .github -mindepth 1 -maxdepth 1 ! -name workflows -print -quit)"
          git push origin HEAD:${{ github.ref_name }}
